<article class="prose-page">
    <p class="eyebrow"><a href="/news">News</a> · {{ date format="j F Y" }}{{ if by }} · {{ by }}{{ /if }}</p>
    <h1>{{ title }}</h1>
    {{ if image }}<img class="hero" src="{{ image:url }}" alt="">{{ /if }}
    <div class="body">{{ body }}</div>
    {{ if source_link }}<p class="meta"><a href="{{ source_link }}" rel="noopener">Read the original</a></p>{{ /if }}
</article>
