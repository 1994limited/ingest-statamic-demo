<article class="prose-page">
    <p class="eyebrow">Author</p>
    <h1>{{ title }}</h1>
    {{ if bio }}<p class="intro">{{ bio }}</p>{{ /if }}
    <ul class="shelf">
        {{ collection:products authors:contains="{id}" }}
            <li class="book">{{ partial:cover link="true" }}<div class="shelf__caption"><a href="{{ url }}">{{ title }}</a></div></li>
        {{ /collection:products }}
    </ul>
</article>
